{{ $ja := eq .Site.Language.Lang "ja" }}
<div class="memo-dates">
  <span><time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date.Format "2006-01-02" }}</time></span>
  {{ if .Lastmod.After .Date }}
    <span>{{ if $ja }}最終更新：{{ else }}Last modified: {{ end }}<time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}">{{ .Lastmod.Format "2006-01-02" }}</time></span>
  {{ end }}
</div>
