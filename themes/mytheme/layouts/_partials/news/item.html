<li class="news-item">
  <h3 class="news-date"><a href="{{ .RelPermalink }}"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></a></h3>
  <div class="news-item-body">
    <div class="news-summary">
      {{ if strings.Contains .RawContent "<!--more-->" }}
        {{ .Summary }}
      {{ else }}
        {{ .Content }}
      {{ end }}
    </div>
  </div>
</li>
