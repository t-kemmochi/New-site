{{ $page := . }}
{{ with partial "projects/select.html" (dict "page" . "state" "current") }}
  <ul class="project-list home-projects-list" role="list">
    {{ range $i, $project := . }}
      {{ partial "projects/item.html" (dict "page" $page "project" $project "archive" false "id" (printf "home-project-%d" $i)) }}
    {{ end }}
  </ul>
{{ end }}
{{ .Content }}
