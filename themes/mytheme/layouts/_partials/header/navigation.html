{{- $page := . -}}
{{- $navLabel := cond (eq .Site.Language.Lang "ja") "メインナビゲーション" "Main navigation" -}}
    <nav class="site-nav" aria-label="{{ $navLabel }}">
      <ul class="site-menu">
        {{ range .Site.Menus.main }}
          {{- $isCurrent := $page.IsMenuCurrent "main" . -}}
          {{- $isAncestor := $page.HasMenuCurrent "main" . -}}

          <li class="site-menu-item">
            <a
              href="{{ .URL }}"
              {{ if $isCurrent }}
                class="is-current"
                aria-current="page"
              {{ else if $isAncestor }}
                class="is-ancestor"
              {{ end }}
            >{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
