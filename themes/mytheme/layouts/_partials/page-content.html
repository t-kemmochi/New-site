{{ $page := .page }}
<article class="container page-content">
  <h1>{{ if and $page.IsPage (eq $page.Type "news") }}<time datetime="{{ $page.Date.Format "2006-01-02" }}">{{ partial "page-title.html" $page }}</time>{{ else }}{{ $page.Title }}{{ end }}</h1>
  {{ with .metadata }}{{ . }}{{ end }}
  {{ $page.Content }}
</article>
