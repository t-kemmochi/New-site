{{- $ja := eq .Site.Language.Lang "ja" -}}
<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    {{ partial "header/navigation.html" . }}
    {{ partial "header/language-switcher.html" . }}
    <button class="menu-toggle" type="button" aria-label="{{ if $ja }}メニューを開く{{ else }}Open menu{{ end }}" aria-controls="mobile-menu" aria-haspopup="dialog" aria-expanded="false" hidden>
      {{ partial "icons/image.html" "icon/menu.svg" }}
    </button>
  </div>
</header>

<dialog class="menu-dialog" id="mobile-menu" aria-label="{{ if $ja }}サイトメニュー{{ else }}Site menu{{ end }}">
  <div class="menu-panel">
    <div class="menu-topline">
      <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
      <button class="menu-close" type="button" aria-label="{{ if $ja }}メニューを閉じる{{ else }}Close menu{{ end }}" autofocus>
        {{ partial "icons/image.html" "icon/close.svg" }}
      </button>
    </div>
    {{ partial "header/navigation.html" . }}
    {{ partial "header/language-switcher.html" . }}
  </div>
</dialog>
