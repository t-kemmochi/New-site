# authorsの○・◯は原文の発表者マーク。場所・都市の不明値は推測しない。
# url・venue_url・links・formatは原文のリンクやPoster表記を保持する補助項目。
# canceledはキャンセル理由の文字列。未指定ならキャンセル表示なし。

