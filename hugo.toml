baseURL = 'https://t-kemmochi.github.io/New-site/'
theme = 'mytheme'

# 日本語を既定言語にし、日本語にも /ja/ を付けます。
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = true

# 日付の解釈に使用するタイムゾーン。
timeZone = 'Asia/Tokyo'

# GA4の測定ID（例：G-XXXXXXXXXX）。空欄なら計測コードを出力しません。
[services.googleAnalytics]
  id = ''

[languages]
  [languages.ja]
    label = 'JP'
    locale = 'ja-JP'
    title = 'T. Kemmochi'
    weight = 1
    hasCJKLanguage = true

    [languages.ja.params]
      description = '名城大学理工学部数学科の剱持智哉の個人サイトです. 偏微分方程式に対する数値解析の研究をしています.'

  [languages.en]
    label = 'EN'
    locale = 'en-US'
    title = 'T. Kemmochi'
    weight = 2

    [languages.en.params]
      description = 'This is a personal website of Tomoya Kemmochi, curently in Department of Mathematics, Meijo University. I am working on numerical analysis for PDEs.'

# ヘッダーのメニュー定義は config/_default/languages.yaml で管理します。

# Hugo内蔵のChromaでコードフェンスを静的にハイライトする。
# 色をHTMLに含めるため、追加のCSS・JavaScriptやcodeパラメーターは不要。
[markup.highlight]
  codeFences = true
  noClasses = true
  style = 'monokai'

# 数式中のアンダースコア・改行・バックスラッシュ等をMarkdown処理から保護する。
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    inline = [['$', '$']]
    block = [
      ['\[', '\]'],
      ['\begin{equation}', '\end{equation}'],
      ['\begin{equation*}', '\end{equation*}'],
      ['\begin{align}', '\end{align}'],
      ['\begin{align*}', '\end{align*}'],
      ['\begin{alignat}', '\end{alignat}'],
      ['\begin{alignat*}', '\end{alignat*}'],
      ['\begin{gather}', '\end{gather}'],
      ['\begin{gather*}', '\end{gather*}'],
      ['\begin{multline}', '\end{multline}'],
      ['\begin{multline*}', '\end{multline*}'],
      ['\begin{flalign}', '\end{flalign}'],
      ['\begin{flalign*}', '\end{flalign*}'],
      ['\begin{eqnarray}', '\end{eqnarray}'],
      ['\begin{eqnarray*}', '\end{eqnarray*}'],
      ['\begin{displaymath}', '\end{displaymath}'],
    ]
