baseURL = 'https://t-kemmochi.github.io/New-site/'
theme = 'mytheme'

# 日本語を既定言語にし、日本語にも /ja/ を付けます。
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = true

# 日付の解釈に使用するタイムゾーン。
timeZone = 'Asia/Tokyo'

# GA4の測定ID（例：G-XXXXXXXXXX）。空欄なら計測コードを出力しません。
[services.googleAnalytics]
  id = ''

[languages]
  [languages.ja]
    label = 'JP'
    locale = 'ja-JP'
    title = 'T. Kemmochi'
    weight = 1
    hasCJKLanguage = true

    [languages.ja.params]
      description = '研究者名の個人サイトです。研究内容、業績、略歴などを紹介します。'

  [languages.en]
    label = 'EN'
    locale = 'en-US'
    title = 'T. Kemmochi'
    weight = 2

    [languages.en.params]
      description = 'Personal website of Your Name, featuring research, publications, and biography.'


